name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  # head_ref is empty on push, so each commit on main gets its own group and is never cancelled
  group: '${{ github.workflow }}-${{ github.head_ref || github.sha }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HUSKY: 0
  CI: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      fail-fast: true
      matrix:
        node:
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2
        with:
          node-version: ${{ matrix.node }}

      - name: Run build
        run: pnpm run build

      - name: Run test
        run: pnpm run test

      - name: Ensure proper oxlint config rules
        run: pnpm --filter="@marcalexiei/oxlint-config" run rules:check

  code-checks:
    name: Code checks

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2

      - name: Typecheck
        run: pnpm run typecheck

      - name: Format
        run: pnpm run format:check

      # the playground lints itself with the built config
      - name: Run build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

  ci-ok:
    name: CI OK
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    needs:
      - test
      - code-checks
    permissions:
      actions: read # required to list the run's jobs
      contents: read # required to read the workflow file
    steps:
      - name: Check needed jobs
        uses: marcalexiei/github-actions/check-needs@652ec15e6c9f4a6fa9dbfcf13c45787b29edfba2 # feat/check-needs, unreleased
        with:
          needs: ${{ toJSON(needs) }}
