name: Release

# guarded at job level against fork PRs: only this repo's own CI runs can release
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

defaults:
  run:
    shell: bash

env:
  HUSKY: 0

jobs:
  release:
    name: Release
    environment: release-npm
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write # required to push release commits and tags
      pull-requests: write # required to create and update release PRs
      id-token: write # added for provenance

    steps:
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@e3b04865510c657477cc722854b31a3b74c72c09 # v2.2.0
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          commit-message: 'chore: release'
          pr-title: 'chore: release'
          pr-base-branch: main
          publish-script: 'pnpm release'

  on-ci-fail:
    name: 'Failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo "CI failed. Release won't be executed"
